<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f0f13; color: #e8e8f0; font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; }
.screen { padding: 36px 22px 32px; display: none; }
.screen.active { display: block; }
.label { font-size: 11px; letter-spacing: 4px; color: #6366f1; font-weight: 700; margin-bottom: 8px; }
h1 { font-size: 26px; font-weight: 900; line-height: 1.2; }
.sub { font-size: 12px; color: #555; margin-top: 6px; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; background: #1a1a24; border-radius: 14px; padding: 14px 16px; margin: 20px 0; }
.stat-item { text-align: center; }
.stat-val { font-size: 22px; font-weight: 900; }
.stat-lbl { font-size: 10px; color: #555; margin-top: 2px; }
.alert { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); border-radius: 12px; padding: 11px 14px; font-size: 12px; margin-bottom: 14px; }
.alert-title { color: #ef4444; font-weight: 700; }
.weak-label { font-size: 10px; color: #444; letter-spacing: 2px; margin-bottom: 8px; }
.weak-item { background: #1a1a24; border-radius: 10px; padding: 10px 14px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.weak-count { color: #ef4444; font-weight: 700; font-size: 12px; }
.btn-primary { width: 100%; padding: 17px; background: #6366f1; border: none; border-radius: 14px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 10px; box-shadow: 0 8px 28px rgba(99,102,241,0.35); font-family: inherit; }
.btn-secondary { padding: 14px; background: #1a1a24; border: 1px solid #2a2a38; border-radius: 12px; color: #aaa; font-size: 13px; cursor: pointer; font-family: inherit; width: 100%; }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.back-btn { background: none; border: none; color: #6366f1; font-size: 20px; cursor: pointer; }
.page-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.page-title { font-size: 18px; font-weight: 700; }
.quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
.quiz-prog { font-size: 12px; color: #555; }
.quiz-type-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.quiz-correct-count { font-size: 12px; color: #6366f1; font-weight: 700; }
.quiz-card { background: #1a1a24; border-radius: 18px; padding: 24px 20px; margin-bottom: 18px; min-height: 180px; display: flex; flex-direction: column; }
.quiz-topic { font-size: 11px; color: #555; margin-bottom: 10px; }
.quiz-prompt { font-size: 15px; line-height: 1.9; font-weight: 500; white-space: pre-wrap; flex: 1; }
.quiz-hint { font-size: 11px; color: #333; margin-top: 14px; }
.reveal-btn { width: 100%; padding: 17px; background: #1a1a24; border: 2px solid #6366f1; border-radius: 14px; color: #6366f1; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; }
.answer-box { background: #0d2218; border: 1px solid rgba(16,185,129,0.25); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
.answer-label { font-size: 10px; color: #10b981; letter-spacing: 2px; margin-bottom: 8px; }
.answer-text { font-size: 14px; line-height: 1.9; white-space: pre-wrap; }
.judge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-correct { padding: 16px; background: #10b981; border: none; border-radius: 13px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn-wrong { padding: 16px; background: #ef4444; border: none; border-radius: 13px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
.reason-title { font-size: 12px; color: #666; text-align: center; margin-bottom: 12px; }
.reason-btn { width: 100%; padding: 13px 18px; background: #1a1a24; border-radius: 12px; color: #ddd; font-size: 14px; cursor: pointer; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; font-family: inherit; border: none; }
.result-emoji { font-size: 48px; text-align: center; margin-bottom: 10px; }
.result-score { font-size: 36px; font-weight: 900; text-align: center; }
.result-msg { font-size: 13px; color: #555; text-align: center; margin-top: 6px; margin-bottom: 24px; }
.result-list { background: #1a1a24; border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; }
.result-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #2a2a38; }
.result-item:last-child { border-bottom: none; }
.result-item-name { font-size: 13px; font-weight: 500; }
.result-item-type { font-size: 10px; color: #444; margin-top: 2px; }
.next-focus { background: rgba(239,68,68,0.07); border: 1px solid rgba(239,68,68,0.2); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
.next-focus-title { font-size: 10px; color: #ef4444; font-weight: 700; margin-bottom: 8px; }
.stat-card { background: #1a1a24; border-radius: 13px; padding: 15px; margin-bottom: 9px; }
.stat-card-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
.stat-card-name { font-weight: 600; font-size: 14px; }
.stat-card-stars { font-size: 12px; color: #f59e0b; }
.stat-mini-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.stat-mini { background: #0f0f13; border-radius: 8px; padding: 8px 4px; text-align: center; }
.stat-mini-val { font-size: 14px; font-weight: 700; }
.stat-mini-lbl { font-size: 9px; color: #444; margin-top: 2px; }
.paste-guide { background: #1a1a24; border-radius: 11px; padding: 12px 14px; margin-bottom: 14px; font-size: 11px; color: #555; line-height: 1.9; }
.paste-guide-title { color: #6366f1; font-weight: 700; margin-bottom: 6px; }
textarea { width: 100%; min-height: 170px; background: #1a1a24; border: 1px solid #2a2a38; border-radius: 12px; padding: 14px; color: #e8e8f0; font-size: 13px; line-height: 1.8; resize: vertical; font-family: inherit; }
textarea:focus { outline: none; border-color: #6366f1; }
.parse-result { background: rgba(16,185,129,0.07); border: 1px solid rgba(16,185,129,0.22); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.parse-result-title { font-size: 13px; color: #10b981; font-weight: 700; margin-bottom: 8px; }
.parse-result-item { font-size: 12px; color: #aaa; margin-bottom: 4px; }
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-add { padding: 14px; background: #6366f1; border: none; border-radius: 12px; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn-replace { padding: 14px; background: #1a1a24; border: 1px solid #3a3a50; border-radius: 12px; color: #aaa; font-size: 13px; cursor: pointer; font-family: inherit; }
#toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #6366f1; color: #fff; padding: 10px 22px; border-radius: 20px; font-size: 13px; z-index: 999; box-shadow: 0 4px 20px rgba(99,102,241,0.4); display: none; white-space: nowrap; }
</style>
</head>
<body>
<div id="app">
<div id="toast"></div>

<!-- HOME -->
<div id="screen-home" class="screen active">
  <div class="label">민사소송법 · 16기</div>
  <h1>취침 전<br>암기 퀴즈</h1>
  <div class="sub" id="home-sub"></div>
  <div class="stats-grid">
    <div class="stat-item"><div class="stat-val" style="color:#6366f1" id="stat-total">0</div><div class="stat-lbl">전체논점</div></div>
    <div class="stat-item"><div class="stat-val" style="color:#ef4444" id="stat-weak">0</div><div class="stat-lbl">취약논점</div></div>
    <div class="stat-item"><div class="stat-val" style="color:#f59e0b" id="stat-new">0</div><div class="stat-lbl">미학습</div></div>
  </div>
  <div id="uncovered-alert" class="alert" style="display:none"><span class="alert-title">⚠ 미학습: </span><span id="uncovered-names"></span></div>
  <div id="weak-section" style="display:none">
    <div class="weak-label">취약 논점 TOP</div>
    <div id="weak-list"></div>
  </div>
  <button class="btn-primary" onclick="startSession()">퀴즈 시작 (5문제)</button>
  <div class="btn-grid">
    <button class="btn-secondary" onclick="showScreen('stats')">📊 통계</button>
    <button class="btn-secondary" onclick="showScreen('paste')">📋 자료 붙여넣기</button>
  </div>
</div>

<!-- QUIZ -->
<div id="screen-quiz" class="screen" style="padding-top:32px">
  <div class="quiz-header">
    <div class="quiz-prog" id="quiz-prog">1 / 5</div>
    <div class="quiz-type-badge" id="quiz-type-badge"></div>
    <div class="quiz-correct-count" id="quiz-correct-count">0정답</div>
  </div>
  <div class="quiz-card" id="quiz-card-el">
    <div class="quiz-topic" id="quiz-topic-name"></div>
    <div class="quiz-prompt" id="quiz-prompt"></div>
    <div class="quiz-hint" id="quiz-hint"></div>
  </div>
  <div id="quiz-actions"><button class="reveal-btn" onclick="revealAnswer()">정답 확인</button></div>
</div>

<!-- RESULT -->
<div id="screen-result" class="screen">
  <div class="result-emoji" id="result-emoji">🎯</div>
  <div class="result-score" id="result-score"></div>
  <div class="result-msg" id="result-msg"></div>
  <div class="result-list" id="result-list"></div>
  <div id="next-focus-box" class="next-focus" style="display:none">
    <div class="next-focus-title">다음 세션 집중 논점</div>
    <div id="next-focus-list"></div>
  </div>
  <button class="btn-primary" onclick="startSession()">한 번 더</button>
  <button class="btn-secondary" style="margin-top:0" onclick="showScreen('home')">홈으로</button>
</div>

<!-- STATS -->
<div id="screen-stats" class="screen">
  <div class="page-header">
    <button class="back-btn" onclick="showScreen('home')">←</button>
    <div class="page-title">논점별 통계</div>
  </div>
  <div id="stats-list"></div>
</div>

<!-- PASTE -->
<div id="screen-paste" class="screen">
  <div class="page-header">
    <button class="back-btn" onclick="showScreen('home')">←</button>
    <div class="page-title">자료 붙여넣기</div>
  </div>
  <div class="paste-guide">
    <div class="paste-guide-title">인식 가능한 형식</div>
    <div>【논점 N】 논점명 ★★★</div>
    <div>사례형 검토순서: A→B→C→D</div>
    <div>判 판례내용 &lt;키워드&gt; → 빈칸 퀴즈</div>
    <div>◆ 개념명(자·현·권) + · 의미1, 의미2, 의미3</div>
  </div>
  <textarea id="paste-input" placeholder="프로젝트2 찌라시를 여기에 붙여넣으세요..."></textarea>
  <div id="parse-result-box" style="display:none;margin-top:12px"></div>
  <button class="btn-primary" style="margin-top:12px" id="parse-btn" onclick="handleParse()">✨ 자동 분석 시작</button>
</div>

</div>

<script>
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbzkZ2uad6YDHpyn6CZJI7nc8a16uRsDB0s45Q6BYbiC_bkNVg-v9efGKhDLVIhr7Rrp/exec";
const QUIZ_TYPES = { CHECKLIST:"목차순서", KEYWORD:"판례키워드", DOOMUN:"두문자", CONNECT:"쟁점연결" };
const TYPE_COLOR = { "목차순서":"#6366f1","판례키워드":"#0ea5e9","두문자":"#10b981","쟁점연결":"#f59e0b" };
const WRONG_REASONS = [
  {id:"unknown",label:"몰라서",icon:"❓",color:"#ef4444"},
  {id:"confused",label:"헷갈려서",icon:"🌀",color:"#f97316"},
  {id:"recall",label:"알았는데 못 떠올려서",icon:"💭",color:"#eab308"},
];

const TOPIC_DATA = [
  // ── 기존 논점 ──────────────────────────────────────────
  {id:"t1",name:"확인의 소",stars:3,
    checklist:["대상적격(자·현·권)","확인의 이익(법·현·장)","가장 유효·적절한 수단(적·당·이)"],
    keywords:[{sentence:"확인의 소는 ( )의 ( )의 ( )을 대상으로 한다.",blanks:["자기의","현재의","권리·법률관계"]}],
    doomun:[{key:"대상적격",letters:"자·현·권",meanings:["자기의","현재의","권리·법률관계"]},{key:"확인의 이익",letters:"법·현·장",meanings:["법률상의 지위","현존하는 불안·위험","가장 유효·적절한 수단"]}],
    connects:[{q:"확인의 이익이 부정될 때 대신 검토할 소는?",a:"이행의 소 (확인의 소 보충성)"}],
    correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"t2",name:"이행의 소 - 장래이행",stars:3,
    checklist:["청구적격(의·장·변·확·예)","미리 청구할 필요","선이행청구 예외(조·개·피·담·즉·기)"],
    keywords:[{sentence:"장래이행의 소: 의무불이행사유가 ( ) 이행기까지 존속한다는 것을 ( ) 당시에 ( )으로 예정할 수 있어야 한다.",blanks:["장래","변론종결","확정적"]}],
    doomun:[{key:"청구적격",letters:"의·장·변·확·예",meanings:["의무불이행사유","장래 이행기까지","변론종결 당시","확정적으로","예정할 수 있을 것"]}],
    connects:[{q:"선이행청구 - 미리 청구할 필요 예외 인정 요건은?",a:"저당권·양도담보에서 피담보채무 액수·담보목적을 다투어 변제 후 등기말소 협력을 기대할 수 없는 경우"}],
    correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  // ── 논점 26 ~ 41 (찌라시 누적 반영) ──────────────────
  {id:"n26",name:"논점 26. 소송절차의 중단",stars:5,
    checklist:["당사자 지위 당연승계(긍정설)","중단 요건(중·대·상·대)","중단의 예외(소송대리인 있는 경우)","수계신청(선택설)","간과판결의 효력(위법설)","강제집행(승계집행문설)","판결정본 송달·확정·수계","효력확장설"],
    keywords:[
      {sentence:"判 소송 도중 당사자 일방이 사망 → 소송은 사망자의 ( )들과의 관계에서 ( )를 형성하여 존재 → ( )설",blanks:["상속인","대립당사자구조","당연승계 긍정"]},
      {sentence:"判 중단을 간과한 판결: ( )는 있지만 ( )라 할 수 없고, ( ) 또는 ( )에 의해 취소 구할 수 있다 → ( )설",blanks:["절차상 위법","당연무효","상소","재심","위법"]},
      {sentence:"判 소송대리인 無·중단 간과 → 민집 제31조 준용 → ( ) 부여 → ( )설",blanks:["승계집행문","승계집행문"]},
      {sentence:"判 공동상속인 중 일부에 대해서만 소송대리인이 항소 제기 → ( )설 → A·B·C·D 전부 이심·확정차단 / 나머지는 수계신청 O",blanks:["효력확장"]}
    ],
    doomun:[{key:"중단 요건",letters:"중·대·상·대",meanings:["소송계속 중 당사자 사망","소송대리인 없을 것","상속인 있을 것","소송물이 상속 대상일 것"]}],
    connects:[
      {q:"수계신청 가능 법원은?",a:"원심 또는 상소심 모두 가능 → 선택설"},
      {q:"소송대리인 있는 경우 수계신청의 의미는?",a:"표시정정 신청의 의미를 가짐"}
    ],
    correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"n27",name:"논점 27. 자백과 현저한 사실",stars:3,
    checklist:["재판상 자백 요건(변·일·불·주·사·진)","선행자백","자백의 효과","자백 철회(형·동·착·경)","권리자백","자백간주(제150조)"],
    keywords:[
      {sentence:"判 준비서면에 자백 내용 기재 → 변론기일에서 진술 또는 '( )'되어야 재판상 자백 성립 → ( )설",blanks:["진술간주","재판상 자백"]},
      {sentence:"判 자백의 불리한 기준: 상대방 증명책임 사실뿐 아니라 자기가 증명책임 지는 사실도 ( )이면 불리한 사실 → ( )설",blanks:["패소될 가능성","패소가능성"]},
      {sentence:"자백 철회 예외(형·동·착·경): ( ) / 상대방 ( ) / 진실에 반하고 ( )로 인한 것 / 소송대리인 자백을 당사자가 ( )",blanks:["형사상 처벌할 행위로 인한 때","동의","착오","경정"]},
      {sentence:"자백간주 효과: 법원 구속 ( ) / 당사자 구속 ( ) → 사실심 변론종결 전까지 ( ) 가능",blanks:["O","X","철회"]}
    ],
    doomun:[
      {key:"자백 요건",letters:"변·일·불·주·사·진",meanings:["변론 또는 준비절차에서","상대방 주장과 일치","자기에게 불리한","주요사실에 대한","사실로서의","진술"]},
      {key:"자백 철회 예외",letters:"형·동·착·경",meanings:["형사상 처벌할 행위로 인한 때","상대방의 동의","진실에 반하고 착오","소송대리인 자백 당사자 경정"]}
    ],
    connects:[{q:"권리자백이 재판상 자백 구속력을 갖는 경우는?",a:"법률적 사실의 압축진술(매매·소비대차 등) 또는 선결적 법률관계 진술(소유권 인정 등)"}],

// ── 로컬 파서 ──────────────────────────────────────────────────
function localParseTopics(text) {
  const topicList = [];
  const lines = text.split('\n');
  let cur = null;
  let prevLineWasDoomun = false;
  let pendingDoomun = null;

  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i].trim();
    if (!ln) { prevLineWasDoomun = false; continue; }

    // ── 논점 헤더: 【논점 N】 이름 ★★★ ──
    const hMatch = ln.match(/【논점\s*[\d~\/]+[^】]*】\s*(.+?)(\s*(★+))?$/);
    if (hMatch) {
      if (cur) topicList.push(cur);
      const name = hMatch[1].replace(/★+/g, '').trim();
      const stars = hMatch[3] ? hMatch[3].length : 3;
      cur = makeTopic(name, stars);
      prevLineWasDoomun = false;
      continue;
    }

    // ── ■ 검토순서 소제목 (논점 헤더로도 인식) ──
    const simMatch = ln.match(/^■\s+(.+?)(\s*(★+))?$/);
    if (simMatch && !ln.includes('찌라시') && !ln.includes('민사소송법') && !ln.includes('│')) {
      if (cur) topicList.push(cur);
      const name = simMatch[1].replace(/★+/g, '').replace(/검토순서.*/, '').trim();
      if (name.length > 1) {
        const stars = simMatch[3] ? simMatch[3].length : 3;
        cur = makeTopic(name, stars);
      }
      prevLineWasDoomun = false;
      continue;
    }

    if (!cur) continue;

    // ── 검토순서: A→B→C ──
    if (ln.match(/검토순서|검토목차/)) {
      const part = ln.includes(':') ? ln.split(':').slice(1).join(':') : ln;
      const steps = part.split('→').map(s => s.trim()).filter(Boolean);
      if (steps.length >= 2) cur.checklist = steps;
      prevLineWasDoomun = false;
      continue;
    }

    // ── 판례 키워드: 判 ... <키워드> ──
    if ((ln.startsWith('判') || ln.startsWith('▶判')) && ln.includes('<')) {
      const blanks = [...ln.matchAll(/<([^>]+)>/g)].map(m => m[1]);
      if (blanks.length > 0) {
        const sentence = ln.replace(/^[▶]?判[例]?[\s:]*/,'').replace(/<([^>]+)>/g,'( )');
        cur.keywords.push({ sentence, blanks });
      }
      prevLineWasDoomun = false;
      continue;
    }

    // ── 두문자 헤더: ◆ 개념명(자·현·권) ──
    const doomH = ln.match(/[◆◇]\s*(.+?)\(([가-힣](?:·[가-힣])+)\)/);
    if (doomH) {
      pendingDoomun = { key: doomH[1].trim(), letters: doomH[2] };
      prevLineWasDoomun = true;
      continue;
    }

    // ── 두문자 의미 줄: · <의미1, 의미2, ...> ──
    if (prevLineWasDoomun && pendingDoomun && (ln.startsWith('·') || ln.startsWith('<'))) {
      const raw = ln.replace(/^[·<\s]+/, '').replace(/>$/, '');
      const letterArr = pendingDoomun.letters.split('·');
      // 쉼표나 슬래시로 분리 시도
      let meanings = raw.split(/[,，、\/]/).map(s => s.trim()).filter(Boolean);
      if (meanings.length !== letterArr.length) {
        // 분리 실패 시 전체를 하나의 의미로
        meanings = [raw];
      }
      cur.doomun.push({ key: pendingDoomun.key, letters: pendingDoomun.letters, meanings });
      pendingDoomun = null;
      prevLineWasDoomun = false;
      continue;
    }

    // ── 두문자 인라인: 두문자: 자·현·권 (의미1/의미2/의미3) ──
    const doomInline = ln.match(/두문자:\s*([가-힣](?:·[가-힣])+)\s*\((.+)\)/);
    if (doomInline) {
      const letters = doomInline[1];
      const meanings = doomInline[2].split(/[\/]/).map(s => s.trim());
      cur.doomun.push({ key: cur.name, letters, meanings });
      prevLineWasDoomun = false;
      continue;
    }

    prevLineWasDoomun = false;
  }

  if (cur) topicList.push(cur);
  return topicList;
}

function makeTopic(name, stars) {
  return {
    id: 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2,6),
    name, stars,
    checklist: [], keywords: [], doomun: [], connects: [],
    correctStreak: 0, wrongCount: 0, lastSeen: null, wrongReasons: []
  };
}

// ── 파싱 핸들러 (API 불필요 — 로컬 파싱) ──────────────────────
function handleParse() {
  const text = document.getElementById('paste-input').value.trim();
  if (!text) { showToast('텍스트를 입력해주세요'); return; }

  const btn = document.getElementById('parse-btn');
  btn.textContent = '⏳ 분석 중...';
  btn.disabled = true;
  document.getElementById('parse-result-box').style.display = 'none';

  try {
    parsedTopics = localParseTopics(text);

    if (!parsedTopics.length) {
      showToast('논점을 찾을 수 없습니다 — 【논점 N】 형식을 확인해주세요');
      btn.textContent = '✨ 자동 분석 시작';
      btn.disabled = false;
      return;
    }

    const box = document.getElementById('parse-result-box');
    box.style.display = 'block';
    box.innerHTML = `
      <div class="parse-result">
        <div class="parse-result-title">✓ 논점 ${parsedTopics.length}개 인식 완료</div>
        ${parsedTopics.map(t =>
          `<div class="parse-result-item">· ${t.name} ${'★'.repeat(t.stars)} — 목차 ${t.checklist?.length||0}개 / 판례 ${t.keywords?.length||0}개 / 두문자 ${t.doomun?.length||0}개</div>`
        ).join('')}
      </div>
      <div class="action-grid">
        <button class="btn-add" onclick="confirmParse('add')">+ 기존에 추가</button>
        <button class="btn-replace" onclick="confirmParse('replace')">전체 교체</button>
      </div>`;

    btn.textContent = '✨ 다시 분석';
    btn.disabled = false;
  } catch(e) {
    showToast('파싱 오류: ' + e.message);
    btn.textContent = '✨ 자동 분석 시작';
    btn.disabled = false;
  }
}

// ── 나머지 로직 (원본과 동일) ─────────────────────────────────
function getPriority(t){
  let s=t.stars*30+t.wrongCount*20;
  if(t.correctStreak>=3)s-=40;
  else if(t.correctStreak>=2)s-=20;
  if(!t.lastSeen)s+=50;
  return s;
}

function pickQuestion(){
  const sorted=[...topics].sort((a,b)=>getPriority(b)-getPriority(a));
  const top=sorted.slice(0,Math.min(3,sorted.length));
  const topic=top[Math.floor(Math.random()*top.length)];
  const avail=[];
  if(topic.checklist?.length)avail.push(QUIZ_TYPES.CHECKLIST);
  if(topic.keywords?.length)avail.push(QUIZ_TYPES.KEYWORD);
  if(topic.doomun?.length)avail.push(QUIZ_TYPES.DOOMUN);
  if(topic.connects?.length)avail.push(QUIZ_TYPES.CONNECT);
  return{topic,type:avail[Math.floor(Math.random()*avail.length)]};
}

function buildQuestion(topic,type){
  if(type===QUIZ_TYPES.CHECKLIST)return{type,topicName:topic.name,prompt:`"${topic.name}" 논점의\n검토 목차를 순서대로 말하시오.`,answer:topic.checklist.join(" → "),hint:`총 ${topic.checklist.length}단계`};
  if(type===QUIZ_TYPES.KEYWORD&&topic.keywords?.length){const kw=topic.keywords[Math.floor(Math.random()*topic.keywords.length)];return{type,topicName:topic.name,prompt:kw.sentence,answer:kw.blanks.join(" / "),hint:`빈칸 ${kw.blanks.length}개`};}
  if(type===QUIZ_TYPES.DOOMUN&&topic.doomun?.length){const dm=topic.doomun[Math.floor(Math.random()*topic.doomun.length)];return{type,topicName:topic.name,prompt:`[${topic.name}]\n${dm.key}: ${dm.letters}\n→ 각 글자가 뜻하는 것은?`,answer:dm.meanings.join(" / "),hint:`${dm.letters.split("·").length}가지`};}
  if(type===QUIZ_TYPES.CONNECT&&topic.connects?.length){const cn=topic.connects[Math.floor(Math.random()*topic.connects.length)];return{type,topicName:topic.name,prompt:cn.q,answer:cn.a,hint:"쟁점 연결"};}
  return null;
}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>{s.style.display='none';s.classList.remove('active');});
  const el=document.getElementById('screen-'+name);
  el.style.display='block';el.classList.add('active');
  if(name==='home')renderHome();
  if(name==='stats')renderStats();
}

function renderHome(){
  const uncovered=topics.filter(t=>!t.lastSeen);
  const weak=topics.filter(t=>t.wrongCount>0).sort((a,b)=>b.wrongCount-a.wrongCount).slice(0,3);
  document.getElementById('home-sub').textContent=`총 ${topics.length}개 논점 · 미학습 ${uncovered.length}개`;
  document.getElementById('stat-total').textContent=topics.length;
  document.getElementById('stat-weak').textContent=weak.length;
  document.getElementById('stat-new').textContent=uncovered.length;
  const alertEl=document.getElementById('uncovered-alert');
  if(uncovered.length){alertEl.style.display='block';document.getElementById('uncovered-names').textContent=uncovered.map(t=>t.name).join(', ');}
  else alertEl.style.display='none';
  const weakSec=document.getElementById('weak-section');
  if(weak.length){weakSec.style.display='block';document.getElementById('weak-list').innerHTML=weak.map(t=>`<div class="weak-item"><span>${t.name}</span><span class="weak-count">오답 ${t.wrongCount}회</span></div>`).join('');}
  else weakSec.style.display='none';
}

function startSession(){
  session.questions=Array.from({length:5},()=>pickQuestion());
  session.current=0;sessionResults=[];
  showScreen('quiz');loadQuestion();
}

function loadQuestion(){
  const q=session.questions[session.current];
  currentQ=buildQuestion(q.topic,q.type);
  if(!currentQ){nextQuestion();return;}
  document.getElementById('quiz-prog').textContent=`${session.current+1} / ${session.questions.length}`;
  const badge=document.getElementById('quiz-type-badge');
  badge.textContent=currentQ.type;badge.style.background=TYPE_COLOR[currentQ.type]+'22';badge.style.color=TYPE_COLOR[currentQ.type];
  document.getElementById('quiz-correct-count').textContent=sessionResults.filter(r=>r.correct).length+'정답';
  document.getElementById('quiz-topic-name').textContent=currentQ.topicName;
  document.getElementById('quiz-prompt').textContent=currentQ.prompt;
  document.getElementById('quiz-hint').textContent=currentQ.hint?'힌트: '+currentQ.hint:'';
  document.getElementById('quiz-card-el').style.border=`1px solid ${TYPE_COLOR[currentQ.type]}33`;
  document.getElementById('quiz-actions').innerHTML=`<button class="reveal-btn" onclick="revealAnswer()">정답 확인</button>`;
}

function revealAnswer(){
  document.getElementById('quiz-actions').innerHTML=`
    <div class="answer-box"><div class="answer-label">정답</div><div class="answer-text">${currentQ.answer}</div></div>
    <div class="judge-grid"><button class="btn-correct" onclick="handleCorrect()">✓ 맞았어요</button><button class="btn-wrong" onclick="handleWrongClick()">✗ 틀렸어요</button></div>`;
}

function handleCorrect(){
  const q=session.questions[session.current];
  topics=topics.map(t=>t.id===q.topic.id?{...t,correctStreak:t.correctStreak+1,lastSeen:new Date().toISOString()}:t);
  sessionResults.push({topic:q.topic.name,type:q.type,correct:true});
  nextQuestion();
}

function handleWrongClick(){
  document.getElementById('quiz-actions').innerHTML=`
    <div class="reason-title">왜 틀렸나요?</div>
    ${WRONG_REASONS.map(r=>`<button class="reason-btn" style="border:1px solid ${r.color}44" onclick="handleReason('${r.id}')"><span style="font-size:18px">${r.icon}</span><span style="color:${r.color};font-weight:600">${r.label}</span></button>`).join('')}`;
}

function handleReason(reasonId){
  const q=session.questions[session.current];
  topics=topics.map(t=>t.id===q.topic.id?{...t,correctStreak:0,wrongCount:t.wrongCount+1,lastSeen:new Date().toISOString(),wrongReasons:[...t.wrongReasons,reasonId]}:t);
  sessionResults.push({topic:q.topic.name,type:q.type,correct:false,reason:reasonId});
  nextQuestion();
}

function nextQuestion(){
  if(session.current+1>=session.questions.length){renderResult();showScreen('result');saveToSheets();return;}
  session.current++;loadQuestion();
}

function renderResult(){
  const correct=sessionResults.filter(r=>r.correct).length;
  const total=sessionResults.length;
  document.getElementById('result-emoji').textContent=correct>=4?'🎯':correct>=2?'📚':'💪';
  document.getElementById('result-score').textContent=`${correct} / ${total}`;
  document.getElementById('result-msg').textContent=correct===total?'완벽합니다!':correct>=3?'잘 하고 있어요':'복습이 필요해요';
  document.getElementById('result-list').innerHTML=sessionResults.map(r=>`
    <div class="result-item"><div><div class="result-item-name">${r.topic}</div><div class="result-item-type">${r.type}</div></div>
    <div style="font-size:12px;font-weight:700;color:${r.correct?'#10b981':'#ef4444'}">${r.correct?'✓':'✗ '+(r.reason==='unknown'?'몰라서':r.reason==='confused'?'헷갈려서':'인출실패')}</div></div>`).join('');
  const weak=topics.filter(t=>t.wrongCount>0).sort((a,b)=>b.wrongCount-a.wrongCount).slice(0,3);
  const fb=document.getElementById('next-focus-box');
  if(weak.length){fb.style.display='block';document.getElementById('next-focus-list').innerHTML=weak.map(t=>`<div style="font-size:13px;color:#bbb;margin-bottom:4px">· ${t.name} (오답 ${t.wrongCount}회)</div>`).join('');}
  else fb.style.display='none';
}

function renderStats(){
  document.getElementById('stats-list').innerHTML=topics.map(t=>`
    <div class="stat-card" style="border:1px solid ${t.wrongCount>1?'rgba(239,68,68,0.25)':'transparent'}">
      <div class="stat-card-header"><div class="stat-card-name">${t.name}</div><div class="stat-card-stars">${'★'.repeat(t.stars)}</div></div>
      <div class="stat-mini-grid">
        <div class="stat-mini"><div class="stat-mini-val" style="color:#10b981">${t.correctStreak}</div><div class="stat-mini-lbl">연속정답</div></div>
        <div class="stat-mini"><div class="stat-mini-val" style="color:#ef4444">${t.wrongCount}</div><div class="stat-mini-lbl">누적오답</div></div>
        <div class="stat-mini"><div class="stat-mini-val" style="color:${t.lastSeen?'#6366f1':'#555'}">${t.lastSeen?'완료':'미학습'}</div><div class="stat-mini-lbl">학습</div></div>
      </div>
      ${t.wrongReasons.length?`<div style="font-size:11px;color:#444;margin-top:10px">오답원인: ${[...new Set(t.wrongReasons)].map(r=>r==='unknown'?'몰라서':r==='confused'?'헷갈려서':'인출실패').join(', ')}</div>`:''}
    </div>`).join('');
}

function confirmParse(mode){
  if(!parsedTopics)return;

  // 이름 기준으로 기존 통계 이어받기
  const merged = parsedTopics.map(p => {
    const existing = topics.find(t => t.name === p.name);
    if(existing) return {...p, id:existing.id, correctStreak:existing.correctStreak, wrongCount:existing.wrongCount, lastSeen:existing.lastSeen, wrongReasons:existing.wrongReasons};
    return p;
  });

  if(mode==='add'){
    // 기존 논점은 새 내용(checklist 등)으로 업데이트, 없는 논점만 추가
    const updatedNames = new Set(merged.map(p=>p.name));
    const kept = topics.filter(t=>!updatedNames.has(t.name));
    topics = [...merged, ...kept];
    showToast(`논점 ${merged.length}개 반영됨 ✓`);
  } else {
    topics = merged;
    showToast(`논점 ${merged.length}개로 교체됨 ✓`);
  }

  parsedTopics=null;
  document.getElementById('paste-input').value='';
  document.getElementById('parse-result-box').style.display='none';
  saveLocal();
  saveToSheets();
  showScreen('home');
}

function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.style.display='block';
  setTimeout(()=>{el.style.display='none';},2500);
}

// ── localStorage: 퀴즈 내용 전체 저장 ────────────────────────
function saveLocal(){
  try{ localStorage.setItem('quiz_topics_v2', JSON.stringify(topics)); }catch(e){}
}

function loadLocal(){
  try{
    const raw = localStorage.getItem('quiz_topics_v2');
    if(raw){
      const saved = JSON.parse(raw);
      if(saved && saved.length > 0){ topics = saved; return true; }
    }
  }catch(e){}
  return false;
}

// ── Google Sheets 동기화 ─────────────────────────────────────
async function loadFromSheets(){
  showSyncStatus('☁️ 통계 불러오는 중...');

  // 1. localStorage에서 퀴즈 내용 먼저 복원
  const hasLocal = loadLocal();

  try{
    const res=await fetch(SHEETS_URL+'?action=load');
    const data=await res.json();
    if(data.topics&&data.topics.length>0){
      // 2. Sheets 통계를 이름 기준으로 현재 topics에 덮어씌우기
      topics=topics.map(t=>{
        const saved=data.topics.find(s=>s.id===t.id||s.name===t.name);
        if(saved)return{...t,correctStreak:saved.correctStreak,wrongCount:saved.wrongCount,lastSeen:saved.lastSeen,wrongReasons:saved.wrongReasons};
        return t;
      });
      // 3. localStorage에도 없고 Sheets에만 있는 논점은 메타만 복원
      if(!hasLocal){
        data.topics.forEach(s=>{
          if(!topics.find(t=>t.id===s.id||t.name===s.name)){
            topics.push({...s,checklist:s.checklist||[],keywords:s.keywords||[],doomun:s.doomun||[],connects:s.connects||[]});
          }
        });
      }
    }
    hideSyncStatus();
  }catch(e){
    hideSyncStatus();
    if(!hasLocal) showToast('오프라인 — 로컬 데이터 사용 중');
  }
  renderHome();
}

async function saveToSheets(){
  showSyncStatus('☁️ 저장 중...');
  try{
    await fetch(SHEETS_URL,{method:'POST',body:JSON.stringify({action:'save',topics:topics.map(t=>({id:t.id,name:t.name,stars:t.stars,correctStreak:t.correctStreak,wrongCount:t.wrongCount,lastSeen:t.lastSeen||'',wrongReasons:t.wrongReasons||[],checklist:t.checklist||[],keywords:t.keywords||[],doomun:t.doomun||[],connects:t.connects||[]}))})});
    hideSyncStatus();
    saveLocal();
    showToast('☁️ 저장됨 ✓');
  }catch(e){
    hideSyncStatus();
    saveLocal();
    showToast('저장 실패 — 로컬 저장됨');
  }
}

function showSyncStatus(msg){
  let el=document.getElementById('sync-status');
  if(!el){el=document.createElement('div');el.id='sync-status';el.style.cssText='position:fixed;bottom:20px;right:16px;background:#1a1a24;border:1px solid #2a2a38;border-radius:20px;padding:8px 14px;font-size:12px;color:#888;z-index:998;';document.body.appendChild(el);}
  el.textContent=msg;el.style.display='block';
}
function hideSyncStatus(){const el=document.getElementById('sync-status');if(el)el.style.display='none';}

loadFromSheets();
</script>
