<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f0f13; color: #e8e8f0; font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; }
.screen { padding: 36px 22px 32px; display: none; }
.screen.active { display: block; }
.label { font-size: 11px; letter-spacing: 4px; color: #6366f1; font-weight: 700; margin-bottom: 8px; }
h1 { font-size: 26px; font-weight: 900; line-height: 1.2; }
.sub { font-size: 12px; color: #555; margin-top: 6px; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; background: #1a1a24; border-radius: 14px; padding: 14px 16px; margin: 20px 0; }
.stat-item { text-align: center; }
.stat-val { font-size: 22px; font-weight: 900; }
.stat-lbl { font-size: 10px; color: #555; margin-top: 2px; }
.alert { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); border-radius: 12px; padding: 11px 14px; font-size: 12px; margin-bottom: 14px; }
.alert-title { color: #ef4444; font-weight: 700; }
.weak-label { font-size: 10px; color: #444; letter-spacing: 2px; margin-bottom: 8px; }
.weak-item { background: #1a1a24; border-radius: 10px; padding: 10px 14px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.weak-count { color: #ef4444; font-weight: 700; font-size: 12px; }
.btn-primary { width: 100%; padding: 17px; background: #6366f1; border: none; border-radius: 14px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 10px; box-shadow: 0 8px 28px rgba(99,102,241,0.35); font-family: inherit; }
.btn-secondary { padding: 14px; background: #1a1a24; border: 1px solid #2a2a38; border-radius: 12px; color: #aaa; font-size: 13px; cursor: pointer; font-family: inherit; width: 100%; }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.back-btn { background: none; border: none; color: #6366f1; font-size: 20px; cursor: pointer; }
.page-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.page-title { font-size: 18px; font-weight: 700; }
.quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
.quiz-prog { font-size: 12px; color: #555; }
.quiz-type-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.quiz-correct-count { font-size: 12px; color: #6366f1; font-weight: 700; }
.quiz-card { background: #1a1a24; border-radius: 18px; padding: 24px 20px; margin-bottom: 18px; min-height: 180px; display: flex; flex-direction: column; }
.quiz-topic { font-size: 11px; color: #555; margin-bottom: 10px; }
.quiz-prompt { font-size: 15px; line-height: 1.9; font-weight: 500; white-space: pre-wrap; flex: 1; }
.quiz-hint { font-size: 11px; color: #333; margin-top: 14px; }
.reveal-btn { width: 100%; padding: 17px; background: #1a1a24; border: 2px solid #6366f1; border-radius: 14px; color: #6366f1; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; }
.answer-box { background: #0d2218; border: 1px solid rgba(16,185,129,0.25); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
.answer-label { font-size: 10px; color: #10b981; letter-spacing: 2px; margin-bottom: 8px; }
.answer-text { font-size: 14px; line-height: 1.9; white-space: pre-wrap; }
.judge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-correct { padding: 16px; background: #10b981; border: none; border-radius: 13px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn-wrong { padding: 16px; background: #ef4444; border: none; border-radius: 13px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
.reason-title { font-size: 12px; color: #666; text-align: center; margin-bottom: 12px; }
.reason-btn { width: 100%; padding: 13px 18px; background: #1a1a24; border-radius: 12px; color: #ddd; font-size: 14px; cursor: pointer; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; font-family: inherit; border: none; }
.result-emoji { font-size: 48px; text-align: center; margin-bottom: 10px; }
.result-score { font-size: 36px; font-weight: 900; text-align: center; }
.result-msg { font-size: 13px; color: #555; text-align: center; margin-top: 6px; margin-bottom: 24px; }
.result-list { background: #1a1a24; border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; }
.result-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #2a2a38; }
.result-item:last-child { border-bottom: none; }
.result-item-name { font-size: 13px; font-weight: 500; }
.result-item-type { font-size: 10px; color: #444; margin-top: 2px; }
.next-focus { background: rgba(239,68,68,0.07); border: 1px solid rgba(239,68,68,0.2); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
.next-focus-title { font-size: 10px; color: #ef4444; font-weight: 700; margin-bottom: 8px; }
.stat-card { background: #1a1a24; border-radius: 13px; padding: 15px; margin-bottom: 9px; }
.stat-card-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
.stat-card-name { font-weight: 600; font-size: 14px; }
.stat-card-stars { font-size: 12px; color: #f59e0b; }
.stat-mini-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.stat-mini { background: #0f0f13; border-radius: 8px; padding: 8px 4px; text-align: center; }
.stat-mini-val { font-size: 14px; font-weight: 700; }
.stat-mini-lbl { font-size: 9px; color: #444; margin-top: 2px; }
.paste-guide { background: #1a1a24; border-radius: 11px; padding: 12px 14px; margin-bottom: 14px; font-size: 11px; color: #555; line-height: 1.9; }
.paste-guide-title { color: #6366f1; font-weight: 700; margin-bottom: 6px; }
textarea { width: 100%; min-height: 170px; background: #1a1a24; border: 1px solid #2a2a38; border-radius: 12px; padding: 14px; color: #e8e8f0; font-size: 13px; line-height: 1.8; resize: vertical; font-family: inherit; }
textarea:focus { outline: none; border-color: #6366f1; }
.subject-card { background: #1a1a24; border: 2px solid #2a2a38; border-radius: 18px; padding: 28px 22px; margin-bottom: 14px; cursor: pointer; transition: border-color 0.15s, background 0.15s; text-align: left; width: 100%; font-family: inherit; }
.subject-card:active { background: #22223a; }
.subject-card-icon { font-size: 32px; margin-bottom: 12px; }
.subject-card-name { font-size: 18px; font-weight: 900; color: #e8e8f0; margin-bottom: 6px; }
.subject-card-desc { font-size: 12px; color: #555; }
.subject-card.minsso { border-color: #6366f1; }
.subject-card.minbeop { border-color: #10b981; }
.parse-result { background: rgba(16,185,129,0.07); border: 1px solid rgba(16,185,129,0.22); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.parse-result-title { font-size: 13px; color: #10b981; font-weight: 700; margin-bottom: 8px; }
.parse-result-item { font-size: 12px; color: #aaa; margin-bottom: 4px; }
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-add { padding: 14px; background: #6366f1; border: none; border-radius: 12px; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn-replace { padding: 14px; background: #1a1a24; border: 1px solid #3a3a50; border-radius: 12px; color: #aaa; font-size: 13px; cursor: pointer; font-family: inherit; }
#toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #6366f1; color: #fff; padding: 10px 22px; border-radius: 20px; font-size: 13px; z-index: 999; box-shadow: 0 4px 20px rgba(99,102,241,0.4); display: none; white-space: nowrap; }
</style>
</head>
<body>
<div id="app">
<div id="toast"></div>

<!-- SUBJECT SELECT -->
<div id="screen-subject" class="screen active">
  <div style="padding-top:20px">
    <div class="label">변호사시험 · 16기</div>
    <h1>과목 선택</h1>
    <div class="sub" style="margin-bottom:32px">어떤 과목 퀴즈를 풀까요?</div>
    <button class="subject-card minsso" onclick="selectSubject('minsso')">
      <div class="subject-card-icon">⚖️</div>
      <div class="subject-card-name">민사소송법</div>
      <div class="subject-card-desc" id="subj-desc-minsso">논점 26~46 · 판례 퀴즈</div>
    </button>
    <button class="subject-card minbeop" onclick="selectSubject('minbeop')">
      <div class="subject-card-icon">📘</div>
      <div class="subject-card-name">민법</div>
      <div class="subject-card-desc" id="subj-desc-minbeop">논점 추가 후 퀴즈 가능</div>
    </button>
  </div>
</div>

<!-- HOME -->
<div id="screen-home" class="screen">
  <div class="label" id="home-subject-label">민사소송법 · 16기</div>
  <h1>취침 전<br>암기 퀴즈</h1>
  <div class="sub" id="home-sub"></div>
  <div class="stats-grid">
    <div class="stat-item"><div class="stat-val" style="color:#6366f1" id="stat-total">0</div><div class="stat-lbl">전체논점</div></div>
    <div class="stat-item"><div class="stat-val" style="color:#ef4444" id="stat-weak">0</div><div class="stat-lbl">취약논점</div></div>
    <div class="stat-item"><div class="stat-val" style="color:#f59e0b" id="stat-new">0</div><div class="stat-lbl">미학습</div></div>
  </div>
  <div id="uncovered-alert" class="alert" style="display:none"><span class="alert-title">⚠ 미학습: </span><span id="uncovered-names"></span></div>
  <div id="weak-section" style="display:none">
    <div class="weak-label">취약 논점 TOP</div>
    <div id="weak-list"></div>
  </div>
  <button class="btn-primary" onclick="startSession()">퀴즈 시작 (5문제)</button>
  <div class="btn-grid">
    <button class="btn-secondary" onclick="showScreen('stats')">📊 통계</button>
    <button class="btn-secondary" onclick="showScreen('paste')">📋 자료 붙여넣기</button>
  </div>
  <button class="btn-secondary" style="margin-top:10px;color:#6366f1;font-size:12px" onclick="showScreen('subject')">⇄ 과목 전환</button>
</div>

<!-- QUIZ -->
<div id="screen-quiz" class="screen" style="padding-top:32px">
  <div class="quiz-header">
    <div class="quiz-prog" id="quiz-prog">1 / 5</div>
    <div class="quiz-type-badge" id="quiz-type-badge"></div>
    <div class="quiz-correct-count" id="quiz-correct-count">0정답</div>
  </div>
  <div class="quiz-card" id="quiz-card-el">
    <div class="quiz-topic" id="quiz-topic-name"></div>
    <div class="quiz-prompt" id="quiz-prompt"></div>
    <div class="quiz-hint" id="quiz-hint"></div>
  </div>
  <div id="quiz-actions"><button class="reveal-btn" onclick="revealAnswer()">정답 확인</button></div>
</div>

<!-- RESULT -->
<div id="screen-result" class="screen">
  <div class="result-emoji" id="result-emoji">🎯</div>
  <div class="result-score" id="result-score"></div>
  <div class="result-msg" id="result-msg"></div>
  <div class="result-list" id="result-list"></div>
  <div id="next-focus-box" class="next-focus" style="display:none">
    <div class="next-focus-title">다음 세션 집중 논점</div>
    <div id="next-focus-list"></div>
  </div>
  <button class="btn-primary" onclick="startSession()">한 번 더</button>
  <button class="btn-secondary" style="margin-top:0" onclick="showScreen('home')">홈으로</button>
</div>

<!-- STATS -->
<div id="screen-stats" class="screen">
  <div class="page-header">
    <button class="back-btn" onclick="showScreen('home')">←</button>
    <div class="page-title">논점별 통계</div>
  </div>
  <div id="stats-list"></div>
</div>

<!-- PASTE -->
<div id="screen-paste" class="screen">
  <div class="page-header">
    <button class="back-btn" onclick="showScreen('home')">←</button>
    <div class="page-title">자료 붙여넣기</div>
  </div>
  <div class="paste-guide">
    <div class="paste-guide-title">인식 가능한 형식</div>
    <div>【논점 N】 논점명 ★★★</div>
    <div>사례형 검토순서: A→B→C→D</div>
    <div>判 판례내용 &lt;키워드&gt; → 빈칸 퀴즈</div>
    <div>◆ 개념명(자·현·권) + · 의미1, 의미2, 의미3</div>
  </div>
  <textarea id="paste-input" placeholder="프로젝트2 찌라시를 여기에 붙여넣으세요..."></textarea>
  <div id="parse-result-box" style="display:none;margin-top:12px"></div>
  <button class="btn-primary" style="margin-top:12px" id="parse-btn" onclick="handleParse()">✨ 자동 분석 시작</button>
</div>

</div>

<script>
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbzkZ2uad6YDHpyn6CZJI7nc8a16uRsDB0s45Q6BYbiC_bkNVg-v9efGKhDLVIhr7Rrp/exec";
const QUIZ_TYPES = { CHECKLIST:"목차순서", KEYWORD:"판례키워드", DOOMUN:"두문자", CONNECT:"쟁점연결", HYEONCHUL:"현출암기" };
const TYPE_COLOR = { "목차순서":"#6366f1","판례키워드":"#0ea5e9","두문자":"#10b981","쟁점연결":"#f59e0b","현출암기":"#a855f7" };
const WRONG_REASONS = [
  {id:"unknown",label:"몰라서",icon:"❓",color:"#ef4444"},
  {id:"confused",label:"헷갈려서",icon:"🌀",color:"#f97316"},
  {id:"recall",label:"알았는데 못 떠올려서",icon:"💭",color:"#eab308"},
];

const TOPIC_DATA = [
  // ── 기존 논점 ──────────────────────────────────────────
  {id:"t1",name:"확인의 소",stars:3,
    checklist:["대상적격(자·현·권)","확인의 이익(법·현·장)","가장 유효·적절한 수단(적·당·이)"],
    keywords:[{sentence:"확인의 소는 ( )의 ( )의 ( )을 대상으로 한다.",blanks:["자기의","현재의","권리·법률관계"]}],
    doomun:[{key:"대상적격",letters:"자·현·권",meanings:["자기의","현재의","권리·법률관계"]},{key:"확인의 이익",letters:"법·현·장",meanings:["법률상의 지위","현존하는 불안·위험","가장 유효·적절한 수단"]}],
    connects:[{q:"확인의 이익이 부정될 때 대신 검토할 소는?",a:"이행의 소 (확인의 소 보충성)"}],
    correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"t2",name:"이행의 소 - 장래이행",stars:3,
    checklist:["청구적격(의·장·변·확·예)","미리 청구할 필요","선이행청구 예외(조·개·피·담·즉·기)"],
    keywords:[{sentence:"장래이행의 소: 의무불이행사유가 ( ) 이행기까지 존속한다는 것을 ( ) 당시에 ( )으로 예정할 수 있어야 한다.",blanks:["장래","변론종결","확정적"]}],
    doomun:[{key:"청구적격",letters:"의·장·변·확·예",meanings:["의무불이행사유","장래 이행기까지","변론종결 당시","확정적으로","예정할 수 있을 것"]}],
    connects:[{q:"선이행청구 - 미리 청구할 필요 예외 인정 요건은?",a:"저당권·양도담보에서 피담보채무 액수·담보목적을 다투어 변제 후 등기말소 협력을 기대할 수 없는 경우"}],
    correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  // ── 논점 26 ~ 41 (찌라시 누적 반영) ──────────────────
  {id:"n26",name:"논점 26. 소송절차의 중단",stars:5,
    checklist:["당사자 지위 당연승계(긍정설)","중단 요건(중·대·상·대)","중단의 예외(소송대리인 있는 경우)","수계신청(선택설)","간과판결의 효력(위법설)","강제집행(승계집행문설)","판결정본 송달·확정·수계","효력확장설"],
    keywords:[
      {sentence:"判 소송 도중 당사자 일방이 사망 → 소송은 사망자의 ( )들과의 관계에서 ( )를 형성하여 존재 → ( )설",blanks:["상속인","대립당사자구조","당연승계 긍정"]},
      {sentence:"判 중단을 간과한 판결: ( )는 있지만 ( )라 할 수 없고, ( ) 또는 ( )에 의해 취소 구할 수 있다 → ( )설",blanks:["절차상 위법","당연무효","상소","재심","위법"]},
      {sentence:"判 소송대리인 無·중단 간과 → 민집 제31조 준용 → ( ) 부여 → ( )설",blanks:["승계집행문","승계집행문"]},
      {sentence:"判 공동상속인 중 일부에 대해서만 소송대리인이 항소 제기 → ( )설 → A·B·C·D 전부 이심·확정차단 / 나머지는 수계신청 O",blanks:["효력확장"]}
    ],
    doomun:[{key:"중단 요건",letters:"중·대·상·대",meanings:["소송계속 중 당사자 사망","소송대리인 없을 것","상속인 있을 것","소송물이 상속 대상일 것"]}],
    connects:[
      {q:"수계신청 가능 법원은?",a:"원심 또는 상소심 모두 가능 → 선택설"},
      {q:"소송대리인 있는 경우 수계신청의 의미는?",a:"표시정정 신청의 의미를 가짐"}
    ],
    correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"n27",name:"논점 27. 자백과 현저한 사실",stars:3,
    checklist:["재판상 자백 요건(변·일·불·주·사·진)","선행자백","자백의 효과","자백 철회(형·동·착·경)","권리자백","자백간주(제150조)"],
    keywords:[

  {id:"mb_8",name:"의사무능력자 판단기준",section:"Ⅳ. 의사무능력자",stars:3,hyeonchul:"구체적, 개별적으로 판단. 행위의 일상적인 의미뿐만 아니라 법률적인 의미나 효과에 대하여도 이해할 수 있을 것을 요한다(판례). 의사무능력자의 법률행위는 무효이고, 제141조 단서는 유추적용된다.",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_9",name:"제한능력자 제도의 성격",section:"Ⅴ. 제한능력자·미성년자",stars:3,hyeonchul:"판례는 제한능력자제도는 거래의 안전을 희생시키는 것을 감수하면서 제한능력자 본인을 보호하는 데 그 목적을 두고 있는 강행규정으로서 이에 반하는 계약은 효력이 없다고 판시.",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_10",name:"미성년자 법률행위 (제5조)",section:"Ⅴ. 제한능력자·미성년자",stars:3,hyeonchul:"미성년자가 법률행위를 함에는 법정대리인의 동의를 얻어야 하는바(제5조 1항 본문) 이는 묵시적으로도 가능하나, 미성년자가 동의를 얻지 않고 한 행위는 미성년자 본인 또는 법정대리인이 취소할 수 있다. 묵시적 동의 유무는 1)미성년자의 독자적인 소득의 범위, 2)계약의 내용 등을 고려한다",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_11",name:"신용카드 계약 취소의 효과",section:"Ⅴ. 제한능력자·미성년자",stars:3,hyeonchul:"미성년자가 신용카드 이용계약을 취소한 경우 매매계약은 유효하게 존속, 반환하여야 할 대상은 면제받은 물품대금채무 상당액",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_12",name:"친권자의 대리권 (제920조)",section:"Ⅴ. 제한능력자·미성년자",stars:3,hyeonchul:"판례는 행위의 객관적 성질상 친권자와 자 사이에 이해의 대립이 생길 우려가 있는 행위를 의미하며 친권자의 의도나 실질적으로 이해의 대립이 생겼는가는 묻지 않는다고 하여 형식적 판단설의 입장이다(객.이.의.실.형) 법정대리의 경우는 원칙적으로 대리권의 범위에 제한이 없다(제920조).",doomun_hint:"객.이.의.실.형",correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_13",name:"제17조 (속임수) — 취소권 배제",section:"Ⅴ. 제한능력자·미성년자",stars:3,hyeonchul:"제한능력자가 속임수를 써서 자기를 능력자로 믿게 하거나 법정대리인의 동의가 있는 것으로 믿게 한 경우 취소할 수 없으나(민법 제17조), 판례는 적극적인 사기수단을 써야 속임수에 해당한다고 판시하여 협의설의 입장이다. 미성년자가 법정대리인의 동의서를 위조한 사안이므로 학설 대립에 상관없이 제17조 속임수에 해당한다.",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_14",name:"법인의 권리능력 (제34조)",section:"Ⅵ. 법인",stars:3,hyeonchul:"법인의 권리능력은 정관에서 정한 목적 범위 내로 제한되는바(제34조), 판례는 목적 수행에 필요한지 여부는 행위의 객관적 성질에 따라 추상적으로 판단할 것이지 행위자의 주관적 구체적 의사에 따라 판단할 것은 아니다라고 판시(객.추.주.구)",doomun_hint:"객.추.주.구",correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_15",name:"법인의 불법행위능력 (제35조)",section:"Ⅵ. 법인",stars:3,hyeonchul:"직무에 관한 행위인지 여부는 주관적 구체적으로 판단할 것이 아니라 객관적 추상적으로 판단하여야 하며, 외형상 대표기관의 직무집행행위라고 볼 수 있는 행위를 포함한다고 하여 외형이론의 입장이다. 상대방이 악의거나 중대한 과실이 있는 경우 외형이론이 적용배제된다",doomun_hint:"상대방 악의·중과실 시 외형이론 적용배제",correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_16",name:"자연적 해석",section:"Ⅶ. 법률행위 해석",stars:3,hyeonchul:"(계.형.쌍.진) 계약의 해석에 있어서는 형식적인 문구에만 얽매여서는 아니되고 쌍방 당사자의 진정한 의사가 무엇인가를 탐구하여야 하는 것",doomun_hint:"계.형.쌍.진",correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_17",name:"개별 강행규정 위반과 제103조",section:"Ⅷ. 반사회질서",stars:3,hyeonchul:"판례는 개별 강행규정에 위반하더라도 항상 제103조 위반이 되는 것은 아니라고 보아 구별설.",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_18",name:"동기의 불법",section:"Ⅷ. 반사회질서",stars:3,hyeonchul:"동기는 의사표시의 구성요소가 아니므로 원칙적으로 제103조에 해당하지 않으나, 판례는 표시되거나 상대방에게 알려진 동기가 반사회질서적인 경우에 제103조 위반이라는 입장이다",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_19",name:"반사회질서 법률행위의 효과",section:"Ⅷ. 반사회질서",stars:3,hyeonchul:"반사회질서 법률행위의 무효는 이를 주장할 이익이 있는 자는 누구든지 주장할 수 있다. 반사회질서 법률행위로 인한 급부의 경우 제746조의 불법원인급여에 해당하여 반사적 효과로서 상대방에게 그 소유권이 귀속된다. 그러나 불법원인급여를 받은 상대방이 제3자에게 소유권에 기한 물권적 청구권을 행사할 수 있는 것은 아니다",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_20",name:"이중매매와 반사회질서",section:"Ⅷ. 반사회질서",stars:3,hyeonchul:"판례는 부동산 이중매매는 계약자유의 원칙에 비추어 유효함이 원칙이나 제2매수인이 매도인의 배임행위에 적극 가담한 경우에는 정의관념에 반하는 행위로서 반사회질서 행위로서 무효가 된다고 판시.",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_21",name:"비진의표시 요건",section:"Ⅸ. 의사표시",stars:3,hyeonchul:"진의의 의미와 관련하여 판례는 특정한 내용의 의사표시를 하고자 하는 표의자의 생각을 말하는 것이지 표의자가 진정으로 마음으로 바라는 사항을 뜻하는 것은 아니다라고 판시(진.마.바). 선의면 충분하고 무과실까지는 요구되지 않는다",doomun_hint:"진.마.바",correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_22",name:"허위표시 제3자의 범위",section:"Ⅸ. 의사표시",stars:3,hyeonchul:"108조 허위표시 자체가 제746조의 불법은 아니다. 제108조 제2항의 제3자는 당사자 및 포괄승계인 이외의 자로서 허위표시에 의하여 외형상 형성된 법률관계를 토대로 1)실질적으로 2)새로운 3)법률상 이해관계를 맺은 자를 말한다(판례) (허.형.실.새.법)",doomun_hint:"허.형.실.새.법",correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_23",name:"착오 요건",section:"Ⅸ. 의사표시",stars:3,hyeonchul:"동기는 의사표시의 구성요소가 아니지만 판례는 동기를 의사표시의 내용으로 삼을 것을 상대방에게 표시하고, 착오를 이유로 계약을 취소할 수 있다고 하여 동기표시설의 입장이다. 동기가 상대방으로부터 제공되거나 유발된 경우 판례는 동기의 표시 여부를 묻지 않고 취소를 인정한다. 판례는 이중적 기준설에 따라 주관적 현저성, 객관적 현저성이 모두 충족되어야 한다고 판시. 상대방이 표의자의 착오를 알고 이용한 경우 > 중대한 과실이 있더라도 취소 가능. 취지가 서로 다르고, 요건과 효과도 구별된다(취.요.효)",doomun_hint:"취.요.효",correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_24",name:"일부무효 요건 (일.분.가)",section:"Ⅹ. 법률행위 효력",stars:3,hyeonchul:"판례는 제137조는 임의규정으로서 원칙적으로 사적자치의 원칙이 지배하는 영역에서 적용되므로, 나머지 부분을 무효로 한다면 당해 효력규정의 취지에 반하는 결과가 초래되는 경우에는 나머지 부분까지 무효로 된다고 할 수는 없다. 일반적으로 토지와 그 지상의 건물은 법률적인 운명을 같이하는 것이 거래의 관행이고 당사자의 의사나 경제상의 관념에도 합치되는 것으로",doomun_hint:"일.분.가.",correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_25",name:"확정적 무효 vs 유동적 무효",section:"Ⅹ. 법률행위 효력",stars:3,hyeonchul:"처음부터 허가를 배제·잠탈하는 내용의 계약인 경우 처음부터 확정적으로 무효인 것으로서 유효로 될 여지가 없다. 제746조는 사회적 타당성이 없는 행위(제103조)를 한 사람은 복구를 그 형식 여하에 불구하고 인정하지 않겠다는 이상을 표현한 것",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_26",name:"무효행위의 추인 (무.알.새)",section:"Ⅹ. 법률행위 효력",stars:3,hyeonchul:"무권리자의 추인 \"사적자치의 원칙에 비추어 당연하고\" 취소한 법률행위의 추인: 무효행위의 추인(제139조)의 요건과 효과로서 추인",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_27",name:"취소의 효과 — 원상회복 (소.이.사)",section:"Ⅹ. 법률행위 효력",stars:3,hyeonchul:"쌍무계약이 취소된 경우 선의의 매수인에게 제201조가 적용되어 과실수취권이 인정되는 이상 선의의 매도인에게도 제587조의 유추적용에 의하여 대금의 운용이익 내지 법정이자의 반환을 부정함이 형평에 맞다. 임대인은 임대차계약 존속 중 기한의 이익을 포기하고 임대차보증금반환 채권을 수동채권으로 하여 상계할 수 있고",doomun_hint:"소.이.사",correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_28",name:"소멸시효 기산점",section:"ⅩI. 소멸시효",stars:3,hyeonchul:"소멸시효의 권리를 행사할 수 있는 때는 \"법률상의 장애가 없음을 말하므로 사실상의 장애는 시효의 진행을 막지 못한다\"",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_29",name:"재판상 청구 — 응소에 의한 시효중단 (채.주.승)",section:"ⅩI. 소멸시효",stars:3,hyeonchul:"\"자신이 권리 위에 잠자는 자가 아님을 표명\" 1)채무자가 제기한 소송에서, 2)응소하여 적극적으로 권리를 주장하여, 3)승소한 경우는 제170조의 재판상 청구에 해당하여 시효가 중단된다(채.주.승). \"담보물의 제3취득자나 물상보증인 등 시효 이익을 원용할 수 있는 지위에 있으나 직접 의무를 부담하지 아니하는 자\"가 제기한 소송에서의 응소는 X",doomun_hint:"채.주.승",correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_30",name:"채권자대위소송과 시효중단",section:"ⅩI. 소멸시효",stars:3,hyeonchul:"시효중단의 효력은 특정승계인에게도 미치는 점(제169조), 원고를 권리 위에 잠자는 자로 볼 수 없는 점에 비추어볼 때 당초의 채권자대위소송으로 인한 시효중단의 효력이 소멸하지 않는다. 소송 중에 채무자가 채권양도의 효력을 인정하는 등의 사정으로 인하여 채권양도인의 청구가 기각된 경우 시효중단의 효력이 없어지나, 이 경우에도 채권양수인이 그로부터 6월 내에 채무자를 상대로 재판상의 청구 등을 하면 채권양도인이 최초의 재판상 청구를 한 때부터 시효가 중단된다.",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_31",name:"추심채권자와 시효중단",section:"ⅩI. 소멸시효",stars:3,hyeonchul:"채무자가 권리주체의 지위에서 한 시효중단의 효력은 집행법원의 수권에 따라 피압류채권에 대한 추심권능을 부여받아 일종의 추심기관으로서 그 채권을 추심하는 추심채권자에게도 미친다(주.집.수.추)",doomun_hint:"주.집.수.추",correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_32",name:"보증채무와 주채무 시효연장",section:"ⅩI. 소멸시효",stars:3,hyeonchul:"판례는 연장부정설의 입장인바, 보증채무가 주채무에 부종한다 하더라도 양자는 별개의 채무이고, 제440조의 의미는 보증채무의 부종성에 기인한 것이라기보다는 채권자 보호를 위한 특별규정이기에 주채무의 소멸시효기간 연장은 보증채무에 대하여 미치지 않는다. 담보목적물의 제3취득자 또는 물상보증인은 별개의 독립된 채무를 부담하는 것이 아니라 단지 채무자의 채무를 변제할 책임을 부담하므로 주채무의 소멸시효 연장이 담보물권에도 미친다.",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_33",name:"압류·가압류·가처분에 의한 시효중단",section:"ⅩI. 소멸시효",stars:3,hyeonchul:"판례는 가압류 등은 집행이 되는 것을 전제로 민사소송법 제265조를 유추적용하여 재판상 청구의 소제기와 유사하게 집행을 신청한 때에 소급하여 시효중단의 효력이 발생한다고 한다. 집행에 착수한 이상 집행불능상태가 된 경우에도 시효중단의 효력은 인정된다",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_34",name:"소멸시효 원용권자",section:"ⅩI. 소멸시효",stars:3,hyeonchul:"채무자에 대한 일반채권자는 채권자의 지위에서 독자적으로 소멸시효의 완성을 주장할 수 없다. 판례에 따르면 대위원용이 허용되나 채무자가 시효이익을 적극적으로 포기한 때에는 채무자에 대한 일반채권자는 다른채권자의 채무자에 대한 채권에 대해 소멸시효를 원용할 수 없게 된다.",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_35",name:"시효이익의 포기 — 전합 추정법리 폐기",section:"ⅩI. 소멸시효",stars:4,hyeonchul:"종래판례는 시효완성후 시효이익을 포기하는 듯한 행위가 있으면 시효완성 사실에 대한 악의를 추정하였으나(추정 법리), 최근 전합은 경험칙에 어긋나고, 관념의 통지에 불과한 채무승인과 의사표시에 해당하는 시효이익의 포기는 법적성질이 구별된다는 점, 법적안정성과 공정성에 어긋난다는 점에서 추정 법리를 폐기하였다(공.법.경.) 판례는 시효이익을 이미 포기한 자와의 법률관계를 통하여 비로소 시효이익을 원용할 이해관계를 형성한 자는 이미 이루어진 시효이익의 포기의 효력을 부정할 수는 없다고 판시",doomun_hint:"공.법.경.",correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  // ── 채권법 (2026-05-27 암기노트) ──
  {id:"mb_36",name:"이행보조자 (①)",section:"XII. 채무불이행",stars:3,hyeonchul:"채무자의 의사 관여 아래 그 채무의 이행행위에 속하는 활동을 하는 사람이면 족하고, 채무자에 대하여 종속적인가 독립적인 지위에 있는가는 문제되지 않는다.",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_37",name:"이행보조자 (②)",section:"XII. 채무불이행",stars:3,hyeonchul:"채무자가 이를 승낙하였거나 적어도 묵시적으로 동의한 경우 복이행보조자의 고의 과실에 관하여 제391조의 책임을 부담한다(적.목.동)",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_38",name:"이행지체 (제387조)",section:"XII. 채무불이행",stars:3,hyeonchul:"요건: 이·가·위·위 → 이행기, 가능, 위법, 귀책 / 효과: 강·가·손·해 (강제이행, 가산배상, 손해배상, 해제)",doomun_hint:"이.가.위.위",correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_39",name:"동시이행항변권 (①) — 요건",section:"XII. 채무불이행",stars:3,hyeonchul:"동일한 쌍무계약에 기초한 대가적 채무가 존재할 것, 적어도 상대방의 채무가 변제기에 있을 것, 상대방이 이행 또는 이행의 제공을 하고 있지 않을 것(동.대.변.이)",doomun_hint:"동.대.변.이",correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_40",name:"동시이행항변권 (②) — 중도금 지연손해금",section:"XII. 채무불이행",stars:3,hyeonchul:"중도금 및 이에 대한 지급일 다음날부터 잔대금지급기일까지의 지연손해금과 잔대금의 지급채무는 매도인의 소유권이전등기의무와 동시이행의 관계에 있다",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_41",name:"동시이행항변권 (③) — 계속적 이행제공설",section:"XII. 채무불이행",stars:3,hyeonchul:"판례는 동시이행의 항변권을 소멸시키려면 한번 이행의 제공이 되었다는 사실만으로 불충분하고 이행의 제공이 계속되어야 한다고 보아 계속적 이행제공설의 입장인바, 다만 이행제공의 정도와 관련하여서는 이행장소에 준비하여 두고 그 뜻을 통지하고 신의칙상 요구되는 상당한 시간 간격을 두고 거듭 수령을 최고하면 된다고 한다(준.시.최.)",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_42",name:"동시이행항변권 (④) — 계약해제권 소멸",section:"XII. 채무불이행",stars:3,hyeonchul:"이행기에 한번 이행제공을 하여서 상대방을 이행지체에 빠지게 한 경우, 신의칙상 채무이행의 제공을 계속 할 필요는 없다 하더라도 상대방이 최고 기간 내에 이행 또는 이행제공을 하면 계약해제권은 소멸되므로 상대방의 이행을 수령하고 자신의 채무를 이행할 수 있을 정도의 준비가 되어있으면 된다.",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_43",name:"동시이행항변권 (⑤) — 선이행판결",section:"XII. 채무불이행",stars:3,hyeonchul:"원고의 반대 의사표시가 없는 한 선이행판결",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_44",name:"동시이행항변권 (⑥) — 자동채권 상계 허용",section:"XII. 채무불이행",stars:3,hyeonchul:"양 채무를 현실적으로 이행하여야 할 필요성이 없는 한 동시이행의 항변권이 붙어 있는 채권을 자동채권으로 하는 상계도 허용된다(양현이필상)",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_45",name:"동시이행항변권 (⑦) — 수동채권 상계",section:"XII. 채무불이행",stars:3,hyeonchul:"동시이행의 항변권이 붙어있는 채권은 이를 자동채권으로 하여 상계할 수 없으나, 수동채권에 항변권이 붙어 있는 경우에는 채무자가 이를 포기하고 상계하는 것은 무방하다.",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_46",name:"이행불능 — 물권적 청구권 소멸",section:"XII. 채무불이행",stars:3,hyeonchul:"판례는 물권적 청구권은 그 권리자인 소유자가 소유권을 상실하면 이제 그 발생의 기반이 아예 없게 되어 더 이상 그 존재 자체가 인정되지 아니하는 것이라고 한다(물.소.발.기)",doomun_hint:"후.불.귀.위",correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_47",name:"대상청구권 (①) — 정면 긍정",section:"XII. 채무불이행",stars:3,hyeonchul:"우리 민법은 이행불능의 효과로서 대상청구권을 규정하고 있지 않으나 판례는 해석상 이를 부정할 이유가 없다고 하여 대상청구권을 정면에서 긍정하였다.",doomun_hint:"급.후.대.반",correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_48",name:"대상청구권 (②) — 취득시효 협의수용",section:"XII. 채무불이행",stars:3,hyeonchul:"취득시효가 완성된 토지가 협의수용된 경우 수용으로 인한 이행불능 이전에 시효완성으로 인한 권리 주장 또는 등기청구권의 행사가 있었어야 한다",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_49",name:"대상청구권 (③) — 무제한설",section:"XII. 채무불이행",stars:3,hyeonchul:"무제한설과 제한설이 대립하나, 판례는 매매의 목적물이 화재로 소실됨에 따른 화재보험금에 대해 매수인의 대상청구권을 인정하면서 화재보험금 전부에 대해 대상청구권을 행사할 수 있는 것이지, 매매대금 상당액의 한도 내로 그 범위가 제한된다고 할 수 없다고 판시하여 무제한설에 가까운 입장이다",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_50",name:"이행거절 (①) — 전보배상 청구 불가",section:"XII. 채무불이행",stars:3,hyeonchul:"이행기 전이라도 신의칙상 이행의 최고를 할 필요도 없이 바로 전보배상을 청구할 수 없다.",doomun_hint:"이.거.귀.위",correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_51",name:"이행거절 (②) — 최고 없이 해제 가능",section:"XII. 채무불이행",stars:3,hyeonchul:"이행기의 도래여부와 상관없이 신의칙상 최고 없이도 계약을 해제할 수 있다.",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_52",name:"이행거절 (③) — 구두제공 면제 vs 대가위험",section:"XII. 채무불이행",stars:3,hyeonchul:"판례는 채권자가 미리 수령을 확고하게 거절한 경우에는 채무자는 구두제공조차 하지 않더라도 채무불이행책임을 면하나(460조, 제461조), 대가위험을 상대방에게 이전시키기 위해서는(제538조 제1항 후문) 채무자의 변제제공이 필요하다고 한다",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_53",name:"불완전이행",section:"XII. 채무불이행",stars:3,hyeonchul:"이·불·귀·위 → 이행, 불완전, 귀책, 위법",doomun_hint:"이.불.귀.위",correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_54",name:"채권자지체 (①) — 특정시기",section:"XII. 채무불이행",stars:3,hyeonchul:"지참채무의 경우 채권자의 주소에서 현실의 제공을 한 때(제460조 본문), 즉 목적물이 채권자의 주소에 도달하고 채권자가 언제든지 수령할 수 있는 상태에 놓여진 때 특정된다.",doomun_hint:"수협.이.거.불",correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},
  {id:"mb_55",name:"채권자지체 (②) — 법정책임설",section:"XII. 채무불이행",stars:3,hyeonchul:"채권자지체의 법적성질에 대해 채무불이행책임과 법정책임설이 대립하나, 판례는 채무자가 채권자에 대하여 일반적인 채무불이행책임과 마찬가지로 손해배상이나 계약해제를 구할 수 없다고 하여 법정책임설과 동일한 입장이다.",doomun_hint:null,correctStreak:0,wrongCount:0,lastSeen:null,wrongReasons:[]},

// ── 로컬 파서 ──────────────────────────────────────────────────
function localParseTopics(text) {
  const topicList = [];
  const lines = text.split('\n');
  let cur = null;
  let prevLineWasDoomun = false;
  let pendingDoomun = null;

  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i].trim();
    if (!ln) { prevLineWasDoomun = false; continue; }

    // ── 논점 헤더: 【논점 N】 이름 ★★★ ──
    const hMatch = ln.match(/【논점\s*[\d~\/]+[^】]*】\s*(.+?)(\s*(★+))?$/);
    if (hMatch) {
      if (cur) topicList.push(cur);
      const name = hMatch[1].replace(/★+/g, '').trim();
      const stars = hMatch[3] ? hMatch[3].length : 3;
      cur = makeTopic(name, stars);
      prevLineWasDoomun = false;
      continue;
    }

    // ── ■ 검토순서 소제목 (논점 헤더로도 인식) ──
    const simMatch = ln.match(/^■\s+(.+?)(\s*(★+))?$/);
    if (simMatch && !ln.includes('찌라시') && !ln.includes('민사소송법') && !ln.includes('│')) {
      if (cur) topicList.push(cur);
      const name = simMatch[1].replace(/★+/g, '').replace(/검토순서.*/, '').trim();
      if (name.length > 1) {
        const stars = simMatch[3] ? simMatch[3].length : 3;
        cur = makeTopic(name, stars);
      }
      prevLineWasDoomun = false;
      continue;
    }

    if (!cur) continue;

    // ── 검토순서: A→B→C ──
    if (ln.match(/검토순서|검토목차/)) {
      const part = ln.includes(':') ? ln.split(':').slice(1).join(':') : ln;
      const steps = part.split('→').map(s => s.trim()).filter(Boolean);
      if (steps.length >= 2) cur.checklist = steps;
      prevLineWasDoomun = false;
      continue;
    }

    // ── 판례 키워드: 判 ... <키워드> ──
    if ((ln.startsWith('判') || ln.startsWith('▶判')) && ln.includes('<')) {
      const blanks = [...ln.matchAll(/<([^>]+)>/g)].map(m => m[1]);
      if (blanks.length > 0) {
        const sentence = ln.replace(/^[▶]?判[例]?[\s:]*/,'').replace(/<([^>]+)>/g,'( )');
        cur.keywords.push({ sentence, blanks });
      }
      prevLineWasDoomun = false;
      continue;
    }

    // ── 두문자 헤더: ◆ 개념명(자·현·권) ──
    const doomH = ln.match(/[◆◇]\s*(.+?)\(([가-힣](?:·[가-힣])+)\)/);
    if (doomH) {
      pendingDoomun = { key: doomH[1].trim(), letters: doomH[2] };
      prevLineWasDoomun = true;
      continue;
    }

    // ── 두문자 의미 줄: · <의미1, 의미2, ...> ──
    if (prevLineWasDoomun && pendingDoomun && (ln.startsWith('·') || ln.startsWith('<'))) {
      const raw = ln.replace(/^[·<\s]+/, '').replace(/>$/, '');
      const letterArr = pendingDoomun.letters.split('·');
      // 쉼표나 슬래시로 분리 시도
      let meanings = raw.split(/[,，、\/]/).map(s => s.trim()).filter(Boolean);
      if (meanings.length !== letterArr.length) {
        // 분리 실패 시 전체를 하나의 의미로
        meanings = [raw];
      }
      cur.doomun.push({ key: pendingDoomun.key, letters: pendingDoomun.letters, meanings });
      pendingDoomun = null;
      prevLineWasDoomun = false;
      continue;
    }

    // ── 두문자 인라인: 두문자: 자·현·권 (의미1/의미2/의미3) ──
    const doomInline = ln.match(/두문자:\s*([가-힣](?:·[가-힣])+)\s*\((.+)\)/);
    if (doomInline) {
      const letters = doomInline[1];
      const meanings = doomInline[2].split(/[\/]/).map(s => s.trim());
      cur.doomun.push({ key: cur.name, letters, meanings });
      prevLineWasDoomun = false;
      continue;
    }

    prevLineWasDoomun = false;
  }

  if (cur) topicList.push(cur);
  return topicList;
}

function makeTopic(name, stars) {
  return {
    id: 'p_' + Date.now() + '_' + Math.random().toString(36).substr(2,6),
    name, stars,
    checklist: [], keywords: [], doomun: [], connects: [],
    correctStreak: 0, wrongCount: 0, lastSeen: null, wrongReasons: []
  };
}

// ── 저장/불러오기 ─────────────────────────────────────────
function saveStats() {
  if (!currentSubject) return;
  const key = SUBJECTS[currentSubject].storageKey;
  const d = {};
  topics.forEach(t => { d[t.id] = { correctStreak:t.correctStreak, wrongCount:t.wrongCount, lastSeen:t.lastSeen, wrongReasons:t.wrongReasons }; });
  try { localStorage.setItem(key, JSON.stringify(d)); } catch(e) {}
}
function loadStats() {
  if (!currentSubject) return;
  try {
    const key = SUBJECTS[currentSubject].storageKey;
    // 민사소송법은 기존 키도 호환
    const fallbackKeys = currentSubject === 'minsso'
      ? [key, "quiz_stats_v1", "quiz_stats", "quiz_stats_v3"]
      : [key];
    let raw = null;
    for (const k of fallbackKeys) { raw = localStorage.getItem(k); if (raw) break; }
    if (!raw) return;
    const d = JSON.parse(raw);
    topics.forEach(t => { if (d[t.id]) Object.assign(t, d[t.id]); });
  } catch(e) {}
}

// ── 과목 선택 ─────────────────────────────────────────
function selectSubject(id) {
  currentSubject = id;
  const subj = SUBJECTS[id];
  topics = JSON.parse(JSON.stringify(subj.data));
  loadStats();
  // 과목별 저장된 추가 논점 불러오기
  try {
    const extraKey = subj.storageKey + '_topics';
    const raw = localStorage.getItem(extraKey);
    if (raw) {
      const extra = JSON.parse(raw);
      const existingIds = new Set(topics.map(t => t.id));
      extra.forEach(t => { if (!existingIds.has(t.id)) topics.push(t); });
      loadStats(); // 추가된 논점에도 통계 적용
    }
  } catch(e) {}
  document.getElementById('home-subject-label').textContent = subj.label;
  showScreen('home');
}

// ── 화면 전환 ─────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  if (id === 'home') renderHome();
  if (id === 'stats') renderStats();
  if (id === 'subject') renderSubjectScreen();
  if (id === 'paste') renderPasteGuide();
}

function renderSubjectScreen() {
  Object.keys(SUBJECTS).forEach(id => {
    const subj = SUBJECTS[id];
    const descEl = document.getElementById('subj-desc-' + id);
    if (!descEl) return;
    // 저장된 통계에서 논점 수 계산
    try {
      const key = subj.storageKey;
      const raw = localStorage.getItem(key);
      const extraKey = subj.storageKey + '_topics';
      const extraRaw = localStorage.getItem(extraKey);
      const baseCount = subj.data.length;
      const extraCount = extraRaw ? JSON.parse(extraRaw).length : 0;
      const total = baseCount + extraCount;
      if (total > 0) descEl.textContent = `논점 ${total}개`;
      else descEl.textContent = '논점 추가 후 퀴즈 가능';
    } catch(e) {}
  });
}

// ── 홈 렌더링 ─────────────────────────────────────────
function renderHome() {
  const total = topics.length;
  const weak = topics.filter(t => t.wrongCount > 0).length;
  const newT = topics.filter(t => !t.lastSeen).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-weak').textContent = weak;
  document.getElementById('stat-new').textContent = newT;
  const d = new Date();
  document.getElementById('home-sub').textContent = `${d.getMonth()+1}/${d.getDate()} · 총 ${total}개 논점`;

  const uncovered = topics.filter(t => !t.lastSeen);
  const alertEl = document.getElementById('uncovered-alert');
  if (uncovered.length > 0) {
    alertEl.style.display = 'block';
    document.getElementById('uncovered-names').textContent =
      uncovered.slice(0,3).map(t=>t.name).join(', ') + (uncovered.length > 3 ? ` 외 ${uncovered.length-3}개` : '');
  } else { alertEl.style.display = 'none'; }

  const weakTopics = [...topics].filter(t => t.wrongCount > 0).sort((a,b) => b.wrongCount - a.wrongCount).slice(0,3);
  const weakSection = document.getElementById('weak-section');
  if (weakTopics.length > 0) {
    weakSection.style.display = 'block';
    document.getElementById('weak-list').innerHTML = weakTopics.map(t =>
      `<div class="weak-item"><span>${t.name}</span><span class="weak-count">오답 ${t.wrongCount}회</span></div>`
    ).join('');
  } else { weakSection.style.display = 'none'; }
}

// ── 퀴즈 세션 ─────────────────────────────────────────
function selectTopics(n) {
  const pool = [...topics];
  const weights = pool.map(t => {
    let w = t.stars;
    if (!t.lastSeen) w += 3;
    w += t.wrongCount * 2;
    if (t.correctStreak >= 3) w = Math.max(1, w - 2);
    return Math.max(1, w);
  });
  const total = weights.reduce((a,b) => a+b, 0);
  const selected = [], used = new Set();
  let tries = 0;
  while (selected.length < Math.min(n, pool.length) && tries < n*20) {
    tries++;
    let r = Math.random() * total;
    for (let i = 0; i < pool.length; i++) {
      r -= weights[i];
      if (r <= 0 && !used.has(i)) { used.add(i); selected.push(pool[i]); break; }
    }
  }
  pool.filter((_,i) => !used.has(i)).forEach(t => { if (selected.length < n) selected.push(t); });
  return selected;
}

function makeQuestion(topic) {
  // 민법 현출 퀴즈
  if (topic.hyeonchul) {
    return { topic, type:'HYEONCHUL', prompt:`${topic.name}\n\n현출 문구를 정확히 떠올려보세요.`, answer:topic.hyeonchul, hint:'' };
  }
  const types = [];
  if (topic.checklist && topic.checklist.length >= 2) types.push('CHECKLIST');
  if (topic.keywords && topic.keywords.length > 0) types.push('KEYWORD');
  if (topic.doomun && topic.doomun.length > 0) types.push('DOOMUN');
  if (topic.connects && topic.connects.length > 0) types.push('CONNECT');
  if (!types.length) types.push('CHECKLIST');
  const type = types[Math.floor(Math.random() * types.length)];
  let prompt = '', answer = '', hint = '';
  if (type === 'CHECKLIST') {
    const list = topic.checklist;
    const shuffled = [...list].sort(() => Math.random() - 0.5);
    prompt = `[${topic.name}]\n\n검토순서(목차)를 올바른 순서로 나열하세요.\n\n${shuffled.map((s,i)=>`  ${i+1}. ${s}`).join('\n')}`;
    answer = list.map((s,i)=>`${i+1}. ${s}`).join('\n');
    hint = `총 ${list.length}개 항목`;
  } else if (type === 'KEYWORD') {
    const kw = topic.keywords[Math.floor(Math.random()*topic.keywords.length)];
    prompt = `[${topic.name}]\n\n빈칸을 채우세요:\n\n${kw.sentence}`;
    answer = kw.blanks.map((b,i)=>`(${i+1}) ${b}`).join('\n');
    hint = `빈칸 ${kw.blanks.length}개`;
  } else if (type === 'DOOMUN') {
    const dm = topic.doomun[Math.floor(Math.random()*topic.doomun.length)];
    prompt = `[${topic.name}]\n\n두문자 〈${dm.letters}〉의 각 글자가 뜻하는 것은?`;
    answer = dm.letters.split('·').map((l,i)=>`${l}: ${dm.meanings[i]||'?'}`).join('\n');
    hint = dm.key;
  } else {
    const conn = topic.connects[Math.floor(Math.random()*topic.connects.length)];
    prompt = `[${topic.name}]\n\n${conn.q}`;
    answer = conn.a;
    hint = '쟁점 연결';
  }
  return { topic, type, prompt, answer, hint };
}

function startSession() {
  const sel = selectTopics(5);
  session.questions = sel.map(t => makeQuestion(t));
  session.current = 0;
  sessionResults = [];
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = session.questions[session.current];
  currentQ = q;
  const cur = session.current + 1, total = session.questions.length;
  document.getElementById('quiz-prog').textContent = `${cur} / ${total}`;
  const badge = document.getElementById('quiz-type-badge');
  const typeName = QUIZ_TYPES[q.type] || q.type;
  badge.textContent = typeName;
  badge.style.background = TYPE_COLOR[typeName] || '#6366f1';
  badge.style.color = '#fff';
  badge.style.borderRadius = '20px';
  badge.style.padding = '4px 10px';
  const correctCount = sessionResults.filter(r=>r.isCorrect).length;
  document.getElementById('quiz-correct-count').textContent = `${correctCount}정답`;
  document.getElementById('quiz-topic-name').textContent = q.topic.name;
  document.getElementById('quiz-prompt').textContent = q.prompt;
  document.getElementById('quiz-hint').textContent = q.hint ? `💡 ${q.hint}` : '';
  document.getElementById('quiz-actions').innerHTML =
    `<button class="reveal-btn" onclick="revealAnswer()">정답 확인</button>`;
}

function revealAnswer() {
  const q = currentQ;
  document.getElementById('quiz-actions').innerHTML = `
    <div class="answer-box"><div class="answer-label">정답</div><div class="answer-text">${q.answer.replace(/\n/g,'<br>')}</div></div>
    <div class="judge-grid">
      <button class="btn-correct" onclick="judge(true)">✓ 맞았어요</button>
      <button class="btn-wrong" onclick="judge(false)">✗ 틀렸어요</button>
    </div>`;
}

function judge(isCorrect) {
  const q = currentQ;
  q.topic.lastSeen = new Date().toISOString();
  if (isCorrect) {
    q.topic.correctStreak = (q.topic.correctStreak||0) + 1;
    sessionResults.push({ topic:q.topic, type:q.type, isCorrect:true, reason:null });
    saveStats(); nextQ();
  } else {
    q.topic.wrongCount = (q.topic.wrongCount||0) + 1;
    q.topic.correctStreak = 0;

    // 민법 현출: 두문자 2단계
    if (q.type === 'HYEONCHUL') {
      if (q.topic.doomun_hint) {
        document.getElementById('quiz-actions').innerHTML = `
          <div class="answer-box" style="background:#12102a;border-color:rgba(168,85,247,0.35);margin-bottom:12px">
            <div class="answer-label" style="color:#a855f7;letter-spacing:2px">💡 두문자 힌트</div>
            <div class="answer-text" style="font-size:24px;font-weight:900;letter-spacing:4px;color:#d8b4fe;margin-top:4px">${q.topic.doomun_hint}</div>
          </div>
          <div style="font-size:12px;color:#555;text-align:center;margin-bottom:14px">두문자를 보고 전체 문구를 떠올려보세요</div>
          <div class="judge-grid">
            <button class="btn-correct" onclick="judgeStage2(true)">✓ 떠올렸어요</button>
            <button class="btn-wrong" onclick="judgeStage2(false)">✗ 모르겠어요</button>
          </div>`;
      } else {
        if (!q.topic.wrongReasons) q.topic.wrongReasons = [];
        q.topic.wrongReasons.push('unknown');
        sessionResults.push({ topic:q.topic, type:q.type, isCorrect:false, reason:'unknown' });
        saveStats(); nextQ();
      }
      return;
    }

    // 민소법: 오답 원인 선택
    document.getElementById('quiz-actions').innerHTML += `
      <div style="margin-top:12px">
        <div class="reason-title">오답 원인이 무엇인가요?</div>
        ${WRONG_REASONS.map(r=>`<button class="reason-btn" onclick="wrongReason('${r.id}')" style="border-left:3px solid ${r.color}"><span>${r.icon}</span><span>${r.label}</span></button>`).join('')}
      </div>`;
  }
}

function judgeStage2(canRecall) {
  const q = currentQ;
  const reason = canRecall ? 'recall' : 'unknown';
  if (!q.topic.wrongReasons) q.topic.wrongReasons = [];
  q.topic.wrongReasons.push(reason);
  sessionResults.push({ topic:q.topic, type:q.type, isCorrect:false, reason });
  saveStats(); nextQ();
}

function wrongReason(reasonId) {
  const q = currentQ;
  if (!q.topic.wrongReasons) q.topic.wrongReasons = [];
  q.topic.wrongReasons.push(reasonId);
  sessionResults.push({ topic:q.topic, type:q.type, isCorrect:false, reason:reasonId });
  saveStats(); nextQ();
}

function nextQ() {
  session.current++;
  if (session.current >= session.questions.length) showResult();
  else renderQuestion();
}

// ── 결과 화면 ─────────────────────────────────────────
function showResult() {
  showScreen('result');
  const total = sessionResults.length;
  const correct = sessionResults.filter(r=>r.isCorrect).length;
  const pct = Math.round(correct/total*100);
  document.getElementById('result-emoji').textContent = pct>=80?'🎯':pct>=60?'💪':'📚';
  document.getElementById('result-score').textContent = `${correct} / ${total}`;
  document.getElementById('result-msg').textContent = `${pct}% · ${pct>=80?'훌륭해요! 유지하세요':pct>=60?'잘 했어요. 오답 복습!':'복습이 필요해요. 파이팅!'}`;
  document.getElementById('result-list').innerHTML = sessionResults.map(r=>`
    <div class="result-item">
      <div><div class="result-item-name">${r.topic.name}</div><div class="result-item-type">${QUIZ_TYPES[r.type]||r.type}</div></div>
      <div style=
